name: One-time v2 source fix

on:
  push:
    branches:
      - codex/controlla-efficiency-guidance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/controlla-efficiency-guidance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: Apply exact compile fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/controlla-runtime/src/mcp/v2_full.rs')
          text = path.read_text()
          old = '''        let status = receipt.get("status").and_then(Value::as_str).unwrap_or("verified");\n        receipts.push(receipt);\n        if matches!(status, "unknown" | "failed" | "not_dispatched") {\n            break;\n        }'''
          new = '''        let should_stop = receipt\n            .get("status")\n            .and_then(Value::as_str)\n            .is_some_and(|status| matches!(status, "unknown" | "failed" | "not_dispatched"));\n        receipts.push(receipt);\n        if should_stop {\n            break;\n        }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one receipt-loop match, found {text.count(old)}')
          text = text.replace(old, new)
          old_run = 'pub(super) fn run() -> Result<(), Box<dyn std::error::Error>> {'
          new_run = 'pub(crate) fn run() -> Result<(), Box<dyn std::error::Error>> {'
          if text.count(old_run) != 1:
              raise SystemExit(f'expected exactly one run visibility match, found {text.count(old_run)}')
          text = text.replace(old_run, new_run)
          path.write_text(text)
          Path('.github/workflows/one-time-v2-fix.yml').unlink()
          PY
          cargo fmt --all
      - name: Commit source-only fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix: compile live MCP v2 server"
          git push origin HEAD:codex/controlla-efficiency-guidance
