name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  agent-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run check:agent-ux
  headless-background-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb && sudo apt-get update && sudo apt-get install -y /tmp/google-chrome.deb
      - run: npm ci --ignore-scripts
      - run: npm run check:background-dom
      - run: cargo test -p controlla-browser --test headless_stress --locked -- --ignored --nocapture
      - run: node extensions/chrome-controlla/test-background.cjs --reconnect-only
      - run: for run in {1..8}; do node extensions/chrome-controlla/test-background.cjs; done
        shell: bash
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - name: Clippy production targets
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      - name: Clippy production targets on Windows
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --lib --bins --locked -- -D warnings -A unused-variables
      - name: Clippy all targets including active ESPN integration tests
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/package-build.sh
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0 && test "$(npm --version)" = "11.17.0"
        shell: bash
      - run: npm ci --ignore-scripts
      - run: npm run check:docs
      - run: npm run check:provenance
      - run: node --test packages/chrome-controlla/test-client.cjs
      - run: npm run check:agent-ux
      - run: npm run check:clients
      - name: Verify packaged six-client MCP launch contracts
        if: runner.os != 'Windows'
        run: npm run smoke:client-mcp-contracts
        env:
          CONTROLLA_BINARY_PATH: ${{ github.workspace }}/packages/chrome-controlla/bin/controlla-v2-core
      - name: Verify packaged six-client MCP launch contracts on Windows
        if: runner.os == 'Windows'
        run: npm run smoke:client-mcp-contracts
        env:
          CONTROLLA_BINARY_PATH: ${{ github.workspace }}/packages/chrome-controlla/bin/controlla-v2-core.exe
      - run: npm run check:apps
      - run: npm run check:bench
      - run: npm run check:release
      - run: npm run check:v3
      - run: node extensions/chrome-controlla/test-background.cjs
      - run: npm run check:topology
      - run: node extensions/chrome-controlla/test-v3-batch.cjs
      - run: node --check extensions/chrome-controlla/background.js
      - run: ./scripts/check-dependencies.sh
        shell: bash
      - run: ./scripts/package-check.sh
        shell: bash
