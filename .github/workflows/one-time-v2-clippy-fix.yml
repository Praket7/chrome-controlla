name: One-time v2 clippy fix

on:
  push:
    branches:
      - codex/controlla-efficiency-guidance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/controlla-efficiency-guidance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: Apply exact clippy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/controlla-runtime/src/mcp/v2_full.rs')
          text = path.read_text()
          old = '''        if position + 1 < characters.len() {\n            if tokio::time::timeout_at(deadline, tokio::time::sleep(STRICT_TYPE_DELAY))\n                .await\n                .is_err()\n            {\n                return Ok(json!({\n                    "status":"unknown",\n                    "action":"type",\n                    "dispatch_acknowledged":true,\n                    "reason":"typing deadline expired after a partial dispatch; inspect state and do not automatically retry"\n                }));\n            }\n        }'''
          new = '''        if position + 1 < characters.len()\n            && tokio::time::timeout_at(deadline, tokio::time::sleep(STRICT_TYPE_DELAY))\n                .await\n                .is_err()\n        {\n            return Ok(json!({\n                "status":"unknown",\n                "action":"type",\n                "dispatch_acknowledged":true,\n                "reason":"typing deadline expired after a partial dispatch; inspect state and do not automatically retry"\n            }));\n        }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one collapsible-if match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/one-time-v2-clippy-fix.yml').unlink()
          PY
          cargo fmt --all
      - name: Commit source-only fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: satisfy clippy in strict typing path"
          git push origin HEAD:codex/controlla-efficiency-guidance
