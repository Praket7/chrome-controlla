name: V3 Clippy Fix

on:
  push:
    branches:
      - agent/best-chrome-use-v2

permissions:
  contents: write

jobs:
  clippy-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/best-chrome-use-v2
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged --locked -- -D warnings
      - run: cargo fmt --all
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/controlla-runtime/src/v3.rs crates/controlla-runtime/src/mcp/v3_full.rs crates/controlla-runtime/src/bin/controlla-v2.rs crates/controlla-runtime/tests/v3_core.rs
          git commit -m "fix(v3): apply clippy-safe rewrites"
          git push origin HEAD:agent/best-chrome-use-v2
