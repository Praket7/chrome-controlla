[package]
name = "controlla-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chrome Controlla capability decisions and local CLI"

[dependencies]
controlla-browser = { path = "../controlla-browser", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
getrandom = "=0.3.4"
thiserror = "=2.0.20"

rmcp = { version = "=3.5.1", features = ["transport-io", "transport-streamable-http-server", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
schemars = "=1.2.2"
futures-util = "=0.3.34"
tokio-tungstenite = "=0.28.0"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "futures"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process"] }
futures-util = "=0.3.34"
tokio-tungstenite = "=0.28.0"
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "controlla"
path = "src/main.rs"

[[bin]]
name = "controlla-v2"
path = "src/bin/controlla-v2.rs"
test = false
