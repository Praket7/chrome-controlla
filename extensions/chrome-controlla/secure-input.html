<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controlla secure password entry</title>
  <link rel="stylesheet" href="secure-input.css">
</head>
<body>
  <main>
    <h1>Enter password</h1>
    <p id="context">Confirm the site and field before entering a password.</p>
    <form id="form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="4096">
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit">Use password once</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="secure-input.js" defer></script>
</body>
</html>
